name: Temporary group feed diagnostic

on:
  pull_request:
    branches:
      - codex/gosup-games-mvp
  workflow_dispatch:

jobs:
  fetch-health:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fetch safe group feed diagnostics
        run: |
          set -euo pipefail
          response="$(curl --fail --silent --show-error --retry 10 --retry-delay 5 --max-time 30 https://august.rilabs.tech/api/health)"
          echo "$response" | python -m json.tool
