name: Temporary group feed diagnostic

on:
  pull_request:
    branches:
      - codex/gosup-games-mvp
  workflow_dispatch:

jobs:
  fetch-health:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect DNS and endpoints
        run: |
          set +e
          echo '=== system resolver ==='
          getent ahosts august.rilabs.tech
          echo '=== Cloudflare DNS ==='
          dig @1.1.1.1 august.rilabs.tech A +noall +answer +comments
          dig @1.1.1.1 august.rilabs.tech CNAME +noall +answer +comments
          echo '=== Google DNS ==='
          dig @8.8.8.8 august.rilabs.tech A +noall +answer +comments
          dig @8.8.8.8 august.rilabs.tech CNAME +noall +answer +comments
          echo '=== parent domain nameservers ==='
          dig rilabs.tech NS +short
          echo '=== custom domain health ==='
          curl -I --max-time 15 https://august.rilabs.tech/api/health
          echo '=== Railway generated domain health ==='
          curl -i --max-time 15 https://avgust-v-dvizhenii-production.up.railway.app/api/health
          exit 0
